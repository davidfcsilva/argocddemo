        <defs>
          <radialGradient id="moonGlow" cx="50%" cy="50%" r="50%">
            <stop offset="0%" stop-color="#fff6c9" stop-opacity="0.85"/>
            <stop offset="100%" stop-color="#fff6c9" stop-opacity="0"/>
          </radialGradient>
          <radialGradient id="pumpkinHalo" cx="50%" cy="55%" r="50%">
            <stop offset="0%" stop-color="#ff8c1a" stop-opacity="0.45"/>
            <stop offset="100%" stop-color="#ff8c1a" stop-opacity="0"/>
          </radialGradient>
        </defs>
    
        <!-- Full moon -->
        <circle class="moon-halo" cx="150" cy="100" r="88" fill="url(#moonGlow)"/>
        <circle cx="150" cy="100" r="46" fill="#f3ecc2"/>
        <circle cx="134" cy="86" r="8" fill="rgba(0,0,0,0.06)"/>
        <circle cx="163" cy="112" r="5" fill="rgba(0,0,0,0.05)"/>
        <circle cx="150" cy="122" r="3.5" fill="rgba(0,0,0,0.05)"/>
    
        <!-- Bats (outer g = static position, inner g = animated) -->
        <g transform="translate(58,72) scale(0.8)">
          <g class="bat b1" fill="#150a1f">
            <path d="M0 0 C -10 -9 -24 -9 -34 3 C -25 1 -19 3 -12 8 C -7 4 -3 4 0 6 C 3 4 7 4 12 8 C 19 3 25 1 34 3 C 24 -9 10 -9 0 0 Z"/>
            <ellipse cx="0" cy="3" rx="4" ry="6"/>
            <path d="M-4 -3 L-2 -9 L0 -3 Z"/><path d="M4 -3 L6 -9 L2 -3 Z"/>
          </g>
        </g>
        <g transform="translate(238,92) scale(1.05)">
          <g class="bat b2" fill="#150a1f">
            <path d="M0 0 C -10 -9 -24 -9 -34 3 C -25 1 -19 3 -12 8 C -7 4 -3 4 0 6 C 3 4 7 4 12 8 C 19 3 25 1 34 3 C 24 -9 10 -9 0 0 Z"/>
            <ellipse cx="0" cy="3" rx="4" ry="6"/>
            <path d="M-4 -3 L-2 -9 L0 -3 Z"/><path d="M4 -3 L6 -9 L2 -3 Z"/>
          </g>
        </g>
        <g transform="translate(150,178) scale(0.65)">
          <g class="bat b3" fill="#1c0d24">
            <path d="M0 0 C -10 -9 -24 -9 -34 3 C -25 1 -19 3 -12 8 C -7 4 -3 4 0 6 C 3 4 7 4 12 8 C 19 3 25 1 34 3 C 24 -9 10 -9 0 0 Z"/>
            <ellipse cx="0" cy="3" rx="4" ry="6"/>
            <path d="M-4 -3 L-2 -9 L0 -3 Z"/><path d="M4 -3 L6 -9 L2 -3 Z"/>
          </g>
        </g>
    
        <!-- Spiderweb (top-left corner) -->
        <g stroke="rgba(255,255,255,0.28)" fill="none" stroke-width="1">
          <path d="M8 6 L96 6"/>
          <path d="M8 6 L8 84"/>
          <path d="M8 6 L60 48"/>
          <path d="M8 6 L44 74"/>
          <path d="M8 6 L18 66"/>
          <path d="M28 6 A 20 20 0 0 1 8 26"/>
          <path d="M48 6 A 40 40 0 0 1 8 46"/>
          <path d="M68 6 A 60 60 0 0 1 8 66"/>
        </g>
    
        <!-- Spider hanging on a thread -->
        <g class="spider">
          <line x1="96" y1="6" x2="96" y2="40" stroke="rgba(255,255,255,0.3)" stroke-width="1"/>
          <g transform="translate(96,46)" fill="#0d0616">
            <ellipse cx="0" cy="0" rx="5" ry="6.5"/>
            <circle cx="0" cy="-8" r="3"/>
            <path d="M-4 -2 L-11 -6 M-4 2 L-11 0 M-4 5 L-10 9 M4 -2 L11 -6 M4 2 L11 0 M4 5 L10 9" stroke="#0d0616" stroke-width="1.4" fill="none"/>
          </g>
        </g>
    
        <!-- Ghost (outer g = static position, inner g = animated) -->
        <g transform="translate(196,238)">
          <g class="ghost">
            <path d="M22 0 C 4 0 -4 16 -4 34 L -4 62 C 0 57 4 62 8 62 C 12 62 16 57 20 62 C 24 62 28 57 32 62 C 36 62 40 57 44 62 L 44 34 C 44 16 40 0 22 0 Z" fill="rgba(240,240,255,0.85)"/>
            <circle cx="12" cy="28" r="3.2" fill="#1a1030"/>
            <circle cx="30" cy="28" r="3.2" fill="#1a1030"/>
            <ellipse cx="21" cy="40" rx="3.4" ry="4.5" fill="#1a1030"/>
          </g>
        </g>
    
        <!-- Grass mound -->
        <ellipse cx="150" cy="382" rx="132" ry="18" fill="rgba(20,10,32,0.55)"/>
    
        <!-- Pumpkin halo -->
        <ellipse cx="135" cy="330" rx="118" ry="66" fill="url(#pumpkinHalo)"/>
    
        <!-- Jack-o'-lantern -->
        <g>
          <path d="M135 282 C 133 268 142 260 150 263 C 143 267 138 272 137 286 Z" fill="#3f5e2f"/>
          <ellipse cx="135" cy="330" rx="70" ry="54" fill="#c2410c"/>
          <ellipse cx="100" cy="332" rx="26" ry="49" fill="#e8590c"/>
          <ellipse cx="170" cy="332" rx="26" ry="49" fill="#e8590c"/>
          <ellipse cx="135" cy="330" rx="27" ry="54" fill="#f76707"/>
          <!-- Carved, glowing face -->
          <g class="pumpkin-face" fill="#ffcf3f">
            <path d="M106 312 L130 305 L123 329 Z"/>
            <path d="M164 312 L140 305 L147 329 Z"/>
            <path d="M135 320 L145 334 L125 334 Z"/>
            <path d="M104 344 L111 355 L119 347 L127 357 L135 347 L143 357 L151 347 L159 355 L166 344 L157 339 L113 339 Z"/>
          </g>
        </g>
      </svg>
    
      <h1 class="title">ARGOCD DEMO</h1>
    
      <div class="console">
        <div><span class="label">&gt; GHOST STATUS:</span> <span class="ok">ALL SPIRITS REPORTING</span></div>
        <div><span class="label">&gt; BATS IN FLIGHT:</span> <span class="val">5 / 5</span></div>
        <div><span class="label">&gt; HAUNT LEVEL:</span> <span class="ok">spooky</span> <span style="color:#ff8c1a">🎃</span></div>
        <div><span class="label">&gt; LAST CURSE:</span> <span class="val">just now</span> <span style="color:#c084fc">🦇</span></div>
