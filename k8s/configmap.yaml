apiVersion: v1
kind: ConfigMap
metadata:
  name: nginx-static
  namespace: argocddemo
data:
  index.html: |
    <!DOCTYPE html>
    <html lang="en">
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <title>ArgoCD Demo — Halloween Haunt</title>
        <style>
          * { margin: 0; padding: 0; box-sizing: border-box; }
    
          @keyframes leafFall {
            0%   { transform: translateY(-30px) translateX(0) rotate(0deg); opacity: 0; }
            10%  { opacity: 0.85; }
            100% { transform: translateY(108vh) translateX(70px) rotate(560deg); opacity: 0.15; }
          }
          @keyframes batFly {
            0%   { transform: translate(0, 0); }
            25%  { transform: translate(24px, -14px); }
            50%  { transform: translate(48px, 2px); }
            75%  { transform: translate(24px, 12px); }
            100% { transform: translate(0, 0); }
          }
          @keyframes ghostFloat {
            0%, 100% { transform: translate(0, 0); opacity: 0.8; }
            50%      { transform: translate(5px, -16px); opacity: 0.96; }
          }
          @keyframes pumpkinPulse {
            0%, 100% { filter: drop-shadow(0 0 6px rgba(255,157,0,0.55)) drop-shadow(0 0 18px rgba(255,120,0,0.25)); }
            50%      { filter: drop-shadow(0 0 16px rgba(255,157,0,0.95)) drop-shadow(0 0 42px rgba(255,120,0,0.55)); }
          }
          @keyframes spiderSway {
            0%, 100% { transform: rotate(-9deg); }
            50%      { transform: rotate(9deg); }
          }
          @keyframes moonGlow {
            0%, 100% { opacity: 0.7; }
            50%      { opacity: 1; }
          }
    
          body {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            background:
              radial-gradient(1200px 620px at 50% 10%, rgba(88,44,120,0.38), rgba(0,0,0,0) 60%),
              linear-gradient(175deg, #170b26 0%, #1d0f2e 35%, #241021 65%, #0d0616 100%);
            font-family: 'Courier New', monospace;
            overflow: hidden;
            position: relative;
          }
    
          .leaf {
            position: absolute;
            border-radius: 0 60% 0 60%;
            top: -20px;
            animation: leafFall linear infinite;
            opacity: 0.7;
          }
    
          .bat { animation: batFly 9s ease-in-out infinite; }
          .bat.b1 { animation-duration: 8s; }
          .bat.b2 { animation-duration: 11s; animation-delay: -3s; }
          .bat.b3 { animation-duration: 7s; animation-delay: -5s; }
    
          .ghost { animation: ghostFloat 4.5s ease-in-out infinite; }
    
          .pumpkin-face { animation: pumpkinPulse 2.4s ease-in-out infinite; }
    
          .spider { animation: spiderSway 3.2s ease-in-out infinite; transform-box: fill-box; transform-origin: top center; }
    
          .moon-halo { animation: moonGlow 5s ease-in-out infinite; }
    
          .title {
            color: #ffd8a8;
            font-size: 2.6rem;
            margin-top: 8px;
            letter-spacing: 4px;
            text-shadow: 0 0 24px rgba(255,140,0,0.45), 0 0 60px rgba(255,90,0,0.2);
            z-index: 1;
          }
    
          .console {
            margin-top: 28px;
            padding: 20px 32px;
            background: rgba(12,6,20,0.85);
            border: 1px solid rgba(255,140,0,0.35);
            border-radius: 12px;
            color: #f2a65a;
            font-size: 0.92rem;
            line-height: 1.7;
            z-index: 1;
            box-shadow: 0 0 40px rgba(255,120,0,0.10), inset 0 0 20px rgba(255,120,0,0.04);
            max-width: 540px;
          }
          .console .label { color: #ff8c1a; }
          .console .ok    { color: #c084fc; font-weight: bold; }
          .console .val   { color: #ffe9c7; }
          .cursor-blink {
            animation: pumpkinPulse 1s step-end infinite;
            color: #f2a65a;
          }
        </style>
    </head>
    <body>
    
      <!-- Falling autumn leaves -->
      <script>
        const leafColors = ['#e8590c','#d9480f','#f08c00','#fab005','#c92a2a','#9c36b5','#b45309'];
        for(let i=0;i<42;i++){
          const s=document.createElement('div');
          s.className='leaf';
          const size=8+Math.random()*8;
          s.style.cssText=`width:${size}px;height:${size*1.4}px;background:${leafColors[Math.floor(Math.random()*leafColors.length)]};top:-20px;left:${Math.random()*100}%;animation-delay:${Math.random()*8}s;animation-duration:${5+Math.random()*7}s;opacity:${0.4+Math.random()*0.5}`;
          document.body.appendChild(s);
        }
      </script>
    
