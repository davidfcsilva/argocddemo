apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: argocddemo
  namespace: argocd
spec:
  project: default
  source:
    repoURL: https://github.com/davidfcsilva/argocddemo.git
    targetRevision: refs/heads/development
    path: k8s
  destination:
    server: https://kubernetes.default.svc
    namespace: argocddemo
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
